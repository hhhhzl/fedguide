# FedAvg for HETEROGENEOUS Bandit2D: each client learns a different peak
# Uses more local steps and fewer rounds so clients diverge before aggregation

env_type: "bandit2d"
data_dir: "data/bandit2d"
num_clients: 4

K: 4
sigma: 0.4  # Wider reward region (same as verify_hetero) for gradient signal

rounds: 20
cpus_per_client: 2

# Key: more local steps so each client diverges toward its peak before averaging
n_steps: 1000
lambda_global: 0.0
lambda_local: 0.0
update_epochs: 15
minibatch_size: 64
clip_eps: 0.2
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5

init_log_std: -1.0
log_std_anneal: true
log_std_anneal_rounds: 15
log_std_anneal_target: -2.0

hidden_dim: 256
lr: 5e-4

use_wandb: false
wandb_project: null
run_name: null

output_dir: "./model/policy/bandit2d/fedavg_hetero"
metrics_dir: "./metrics/bandit2d/fedavg_hetero"
collect_metrics_every: 1

device: "auto"
seed: 0
