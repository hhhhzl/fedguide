# FedGuide Bandit2D experiment: client-specific routed experts (prior/guidance)
# Keeps federated setting but routes each client to one shared expert.

env_type: "bandit2d"
data_dir: "data/bandit2d"
num_clients: 4

K: 4
sigma: 0.2

rounds: 60
cpus_per_client: 2

n_steps: 200
lambda_local: 0.05
lambda_guide: 0.1
lambda_guide_anneal: true
lambda_guide_decay_rounds: 60
online_guidance: false
online_prior: false
update_epochs: 10
minibatch_size: 64
init_log_std: -1.0

use_wandb: false
wandb_project: null
run_name: "bandit2d-fedguide-routed-experts"

output_dir: "./model/policy/bandit2d/fedguide_routed"
metrics_dir: "./metrics/bandit2d/fedguide_routed"
collect_metrics_every: 1

# Experimental switch (Bandit2D only)
client_specific_expert_routing: true
num_experts_prior: 4
num_experts_guidance: 4

device: "auto"
seed: 0
