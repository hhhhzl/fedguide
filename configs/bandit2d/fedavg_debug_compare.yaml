# FedAvg fair comparison against fedguide_debug_shared
env_type: "bandit2d"
data_dir: "data/bandit2d"
num_clients: 4

K: 4
sigma: 0.4

rounds: 20
cpus_per_client: 2

n_steps: 1000
lambda_global: 0.0
lambda_local: 0.0
update_epochs: 10
minibatch_size: 64
clip_eps: 0.2
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5

init_log_std: -1.0
log_std_anneal: true
log_std_anneal_rounds: 20
log_std_anneal_target: -2.0

hidden_dim: 256
lr: 3e-4

use_wandb: false
wandb_project: null
run_name: "bandit2d-fedavg-debug-compare"

output_dir: "./model/policy/bandit2d/fedavg_debug_compare"
metrics_dir: "./metrics/bandit2d/fedavg_debug_compare"
collect_metrics_every: 1

device: "auto"
seed: 0
