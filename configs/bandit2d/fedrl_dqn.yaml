# FedRL-DQN Training Configuration for Discrete Action Environments
# Note: DQN requires discrete action space (e.g., CartPole, Acrobot)
# For Bandit2D (continuous actions), use fedrl_ddpg.yaml instead

# Environment configuration
env_type: "cartpole"  # Environment type: "cartpole", "acrobot", etc. (discrete actions)
data_dir: "data/cartpole"
num_clients: 4

# Federated learning configuration
rounds: 60  # Number of federated learning rounds
cpus_per_client: 2  # Number of CPUs per client

# Algorithm type
algo: "dqn"  # Algorithm: "dqn" or "ddpg"

# DQN training configuration
merge_interval: 16  # Number of steps per round (E in FedRL paper)
gamma: 0.9  # Discount factor
epsilon: 1.0  # Initial epsilon for epsilon-greedy
epsilon_decay: 0.99  # Epsilon decay rate
epsilon_min: 0.01  # Minimum epsilon
batch_size: 16  # Batch size for updates
replay_size: 1000  # Replay buffer capacity
replay_initial: 32  # Minimum buffer size before training (default: 2 * batch_size)
sync_interval: 10  # Steps between target network sync
eval_episodes: 1  # Number of episodes for evaluation

# Network configuration
hidden_dim: 128  # Hidden dimension for Q-network
lr: 1e-3  # Learning rate

# Logging configuration
use_wandb: false  # Enable Weights & Biases logging
wandb_project: null  # W&B project name (null to disable)
run_name: null  # Run name for logging (null to use default)

# Output configuration
output_dir: "./model/policy/bandit2d/fedrl_dqn"  # Directory to save model checkpoints
metrics_dir: "./metrics/bandit2d/fedrl_dqn"  # Directory to save metrics for visualization
collect_metrics_every: 1  # Collect metrics every N rounds (0 to disable)

# Device configuration
device: "cpu"  # "auto", "cpu", or "cuda"

# Random seed configuration
# Can be a single integer or a list of integers
# If list, will run training for each seed
seed: [0, 1, 2, 3, 4]  # Run 5 different seeds

