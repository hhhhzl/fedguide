# FedGuide Training Configuration for Bandit2D Environment

# Environment configuration
env_type: "bandit2d"  # Environment type: "bandit2d"
data_dir: "data/bandit2d"
num_clients: 4

# Environment-specific parameters (for bandit2d)
K: 4  # Number of peaks in bandit
sigma: 0.2  # Standard deviation for reward function

# Federated learning configuration
rounds: 60  # Number of federated learning rounds
cpus_per_client: 2  # Number of CPUs per client

# Training configuration
n_steps: 200  # Number of steps per round
lambda_local: 0.05  # Local KL penalty (aligned with FedKL)
lambda_guide: 0.1  # Prior/guidance weight
lambda_guide_anneal: true  # Decay to 0 over training
lambda_guide_decay_rounds: 60
update_epochs: 10  # Aligned with FedKL/FedAvg for fair comparison
minibatch_size: 64  # Minibatch size for updates
init_log_std: -1.0  # Smaller init std for bandit (std=0.37); default 0 gives std=1

# Logging configuration
use_wandb: false  # Enable Weights & Biases logging
wandb_project: null  # W&B project name (null to disable)
run_name: null  # Run name for logging (null to use default)

# Output configuration
output_dir: "./model/policy/bandit2d/fedguide"  # Directory to save model checkpoints
metrics_dir: "./metrics/bandit2d/fedguide"  # Directory to save metrics for visualization
collect_metrics_every: 1  # Collect metrics every N rounds (0 to disable)

# Experimental switches (default off, keeps current FedGuide behavior)
client_specific_expert_routing: false  # Bandit2D-only experiment: route prior/guidance experts per client
num_experts_prior: 1
num_experts_guidance: 1

# Device configuration
device: "auto"  # "auto", "cpu", or "cuda"

# Random seed configuration (single int for run_fedguide_bandit2d.py; use run_from_config.py --seeds 0,1,2,3,4 for multi-seed)
seed: 0

