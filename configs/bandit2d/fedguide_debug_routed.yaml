# FedGuide debug v2 routed experts:
# Same as debug_shared, but enable client-specific expert routing.

env_type: "bandit2d"
data_dir: "data/bandit2d"
num_clients: 4

K: 4
sigma: 0.4

rounds: 20
cpus_per_client: 2

fraction_fit: 1.0
fraction_evaluate: 1.0
min_fit_clients: 4
min_evaluate_clients: 4
min_available_clients: 4

aggregate_mode: "prior+guidance"
n_steps: 1000
lambda_local: 0.05
lambda_guide: 0.1
lambda_guide_anneal: false
lambda_guide_decay_rounds: 20
online_guidance: false
online_prior: false
update_epochs: 10
minibatch_size: 64
init_log_std: -1.0

use_wandb: false
wandb_project: null
run_name: "bandit2d-fedguide-debug-routed"

output_dir: "./model/policy/bandit2d/fedguide_debug_routed"
metrics_dir: "./metrics/bandit2d/fedguide_debug_routed"
collect_metrics_every: 1

client_specific_expert_routing: true
num_experts_prior: 4
num_experts_guidance: 4
routing_debug: true
prior_adapt_fallback_all: true

device: "auto"
seed: 0
