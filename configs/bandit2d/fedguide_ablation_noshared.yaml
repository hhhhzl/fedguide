# FedGuide ablation: remove shared prior/guidance influence
# Goal: verify collapse source. Keep federated protocol unchanged.

env_type: "bandit2d"
data_dir: "data/bandit2d"
num_clients: 4

K: 4
sigma: 0.2

rounds: 60
cpus_per_client: 2

n_steps: 200
lambda_local: 0.05
lambda_guide: 0.0            # ablation: disable guidance pull
lambda_guide_anneal: false
lambda_guide_decay_rounds: 60
online_guidance: false
online_prior: false
update_epochs: 10
minibatch_size: 64
init_log_std: -1.0

use_wandb: false
wandb_project: null
run_name: "bandit2d-fedguide-ablation-noshared"

output_dir: "./model/policy/bandit2d/fedguide_ablation_noshared"
metrics_dir: "./metrics/bandit2d/fedguide_ablation_noshared"
collect_metrics_every: 1

client_specific_expert_routing: false
num_experts_prior: 1
num_experts_guidance: 1

device: "auto"
seed: 0
