# FedMomentum Training Configuration for Bandit2D Environment
# Supports both SVRPG and HAPG algorithms with momentum-based aggregation

# Environment configuration
env_type: "bandit2d"  # Environment type: "bandit2d"
data_dir: "data/bandit2d"
num_clients: 4

# Environment-specific parameters (for bandit2d)
K: 4  # Number of peaks in bandit
sigma: 0.2  # Standard deviation for reward function

# Algorithm selection
algorithm: "fedmomentum"  # Main algorithm name (for runner selection)
algorithm_type: "svrpg"  # Sub-algorithm type: "svrpg" or "hapg"

# Federated learning configuration
rounds: 60  # Number of federated learning rounds
cpus_per_client: 2  # Number of CPUs per client

# Momentum aggregation configuration
momentum_beta: 0.9  # Momentum coefficient (paper default: 0.9)
server_lr: 0.001  # Server learning rate for parameter updates

# Training configuration
n_steps: 200  # Number of steps per round
update_epochs: 4  # Number of update epochs per round
minibatch_size: 64  # Minibatch size for updates
clip_eps: 0.2  # PPO clipping epsilon
entropy_coef: 0.01  # Entropy coefficient
value_coef: 0.5  # Value loss coefficient
max_grad_norm: 0.5  # Maximum gradient norm for clipping
gamma: 0.99  # Discount factor
gae_lambda: 0.95  # GAE lambda parameter

# Network configuration
hidden_dim: 256  # Hidden dimension for networks
lr: 3e-4  # Learning rate

# SVRPG-specific configuration (only used if algorithm="svrpg")
reference_update_freq: 5  # Update reference policy every N rounds (paper: 5-10)
use_svrpg: true  # Enable SVRPG variance reduction (always true for svrpg algorithm)

# HAPG-specific configuration (only used if algorithm="hapg")
hessian_alpha: 0.1  # Hessian correction coefficient (paper: 0.1-1.0)
use_diagonal_approx: true  # Use diagonal approximation for Hessian (computational efficiency)
fisher_update_freq: 1  # Update Fisher Information Matrix every N rounds
use_fisher_info: true  # Use Fisher Information Matrix instead of true Hessian

# Logging configuration
use_wandb: false  # Enable Weights & Biases logging
wandb_project: null  # W&B project name (null to disable)
run_name: null  # Run name for logging (null to use default)

# Output configuration
output_dir: "./model/policy/bandit2d/fedmomentum"  # Directory to save model checkpoints
metrics_dir: "./metrics/bandit2d/fedmomentum"  # Directory to save metrics for visualization
collect_metrics_every: 1  # Collect metrics every N rounds (0 to disable)

# Device configuration
device: "auto"  # "auto", "cpu", or "cuda"

# Random seed configuration
# Can be a single integer or a list of integers
# If list, will run training for each seed
seed: [0, 1, 2, 3, 4]  # Run 5 different seeds


bc_root: ./model/bc_policy
bc_env_name: Bandit2D
