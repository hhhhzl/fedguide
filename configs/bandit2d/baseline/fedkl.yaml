# FedKL Training Configuration for Bandit2D Environment

# Environment configuration
env_type: "bandit2d"  # Environment type: "bandit2d"
data_dir: "data/bandit2d"
num_clients: 4

# Environment-specific parameters (for bandit2d)
K: 4  # Number of peaks in bandit
sigma: 0.2  # Standard deviation for reward function

# Federated learning configuration
rounds: 60  # Number of federated learning rounds
cpus_per_client: 2  # Number of CPUs per client

# Training configuration
n_steps: 200  # Number of steps per round
lambda_global: 0.5  # Global KL penalty (very weak - between FedAvg and strong FedKL)
lambda_local: 0.05  # Local KL penalty coefficient
update_epochs: 10  # Number of update epochs per round
minibatch_size: 64  # Minibatch size for updates
clip_eps: 0.2  # PPO clipping epsilon
entropy_coef: 0.01  # Entropy coefficient
value_coef: 0.5  # Value loss coefficient
max_grad_norm: 0.5  # Maximum gradient norm for clipping

# Bandit-friendly: lower/anneal policy std for faster deterministic convergence
init_log_std: -1.0  # Smaller init (std=0.37); default 0 gives std=1
log_std_anneal: true  # Decay std over training
log_std_anneal_rounds: 40
log_std_anneal_target: -2.0  # std ≈ 0.14 by end

# Network configuration
hidden_dim: 256  # Hidden dimension for networks
lr: 3e-4  # Learning rate

# Logging configuration
use_wandb: false  # Enable Weights & Biases logging
wandb_project: null  # W&B project name (null to disable)
run_name: null  # Run name for logging (null to use default)

# Warm-start ablation: same per-client policy init as FedGuide-prior/pg.
prior_dir: "./model/models_prior_gauss"
prior_env_name: "Bandit2D"

# Output configuration
output_dir: "./model/policy/bandit2d/fedkl"  # Directory to save model checkpoints
metrics_dir: "./metrics/bandit2d/fedkl"  # Directory to save metrics for visualization
collect_metrics_every: 1  # Collect metrics every N rounds (0 to disable)

# Device configuration
device: "auto"  # "auto", "cpu", or "cuda"

# Random seed configuration
# Can be a single integer or a list of integers
# If list, will run training for each seed
seed: [0, 1, 2, 3, 4]  # Run 5 different seeds


bc_root: ./model/bc_policy
bc_env_name: Bandit2D
