# PPO Training Configuration for Bandit2D Environment

# Environment configuration
env_type: "bandit2d"  # Environment type: "bandit2d" or "d4rl"
data_dir: "data/bandit2d"
num_clients: 4

# Environment-specific parameters (for bandit2d)
K: 4  # Number of peaks in bandit
sigma: 0.2  # Standard deviation for reward function

# Training configuration
rounds: 60
steps_per_round: 2000  # Number of environment steps to collect per round (on-policy)
update_epochs: 4  # Number of epochs per update
minibatch_size: null  # If null, use full batch

# Agent configuration
hidden_dim: 256
lr: 3e-4
gamma: 0.99
clip_eps: 0.2  # PPO clipping epsilon
gae_lambda: 0.95  # GAE lambda parameter
entropy_coef: 0.01  # Entropy coefficient
value_coef: 0.5  # Value loss coefficient
max_grad_norm: 0.5  # Maximum gradient norm for clipping
action_std: 0.1  # Initial standard deviation for action distribution (if learnable_std=False)
learnable_std: true  # Use learnable action std (strongly recommended)

# Evaluation configuration
eval_episodes: 50

# Policy logprob collection configuration (for visualization)
collect_logprob: true  # Collect policy log probability distribution on grid
logprob_grid_size: 200  # Grid size for logprob evaluation (grid_size x grid_size)
logprob_bounds: [-1.5, 1.5]  # Bounds for logprob grid evaluation [min, max]

# Output configuration
output_dir: "./model/policy/bandit2d/ppo"
metrics_dir: "./metrics/bandit2d/ppo"
save_every: 10

# Device configuration
device: "auto"  # "auto", "cpu", or "cuda"

# Random seed configuration
# Can be a single integer or a list of integers
# If list, will run training for each seed
seed: [0, 1, 2, 3, 4]  # Run 5 different seeds
bc_root: ./model/bc_policy
bc_env_name: Bandit2D
