env_type: "d4rl"
env_name: "Walker2d-v4"
metadata_path: "data/walker/metadata.json"
num_clients: 8
random_select_clients: false

rounds: 100
cpus_per_client: 2
n_steps: 4096
update_epochs: 10
minibatch_size: 64

hidden_dim: 256
lr: 1e-4
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
entropy_coef: 0.0
value_coef: 0.5
max_grad_norm: 0.5

# Federation regularizers
lambda_global: 0
lambda_local: 0

# BC warm-start (same checkpoint FedGuide uses)
bc_root: "./model/bc_policy"
bc_env_name: "Walker2D"
bc_blend_alpha: 0.3

eval_episodes: 10

output_dir: "./model/policy/walker/fedavg"
metrics_dir: "./metrics/walker/fedavg"
save_every: 10

device: "auto"
gpus_per_client: 0.125
seed: [0]

render_eval: true
render_mode: "video"
render_save_dir: "./plots/walker/fedavg"
render_every_n_rounds: 20
render_episodes: 3
