# FedSVRPG-M strict (arxiv:2405.19499): local Eq. (4) + server u = (1/(ηNK))ΣΔ, θ←θ+λu.
# Clients send policy_delta = θ_{r,K} − θ_r; not PPO/SVRPG gradient uplink.
#
# Appendix E.2 "Details of DRL Case" (MuJoCo-style continuous control in paper):
#   η=0.75, λ=0.6, K=10, N=5, R_max=120, β ∈ {0.2,0.5,0.8} — we use β=0.2 (ablation default).

env_type: "reacher_hetero"
metadata_path: "data/reacher/metadata.json"
num_clients: 5
random_select_clients: false

algorithm: "fedmomentum"
use_fedsvrpgm_strict: true

server_lr: 0.6
fedsvrpgm_eta: 0.75
local_steps_k: 10
fedsvrpgm_beta: 0.2

# Trajectory length per local step (paper R_max=120)
fedsvrpgm_max_horizon: 120

use_server_momentum: false
momentum_beta: 0.9

rounds: 100
cpus_per_client: 1

n_steps: 2048
update_epochs: 4
minibatch_size: 64
clip_eps: 0.2
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5
gamma: 0.99
gae_lambda: 0.95

hidden_dim: 256
lr: 3e-4

reference_update_freq: 5
use_svrpg: true

eval_episodes: 5

use_wandb: false
wandb_project: null
run_name: null

output_dir: "./model/policy/reacher/fedmomentum_svrpgm_strict"
metrics_dir: "./metrics/reacher/fedmomentum_svrpgm_strict"
collect_metrics_every: 1

device: "auto"
gpus_per_client: 0.25

seed: 0

render_eval: false
render_mode: "video"
render_save_dir: "./plots/reacher/fedmomentum_svrpgm_strict"
render_every_n_rounds: 10
render_episodes: 5
