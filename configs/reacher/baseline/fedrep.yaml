# FedRep — federated Reacher with client heterogeneity

env_type: "reacher_hetero"
metadata_path: "data/reacher/metadata.json"
num_clients: 8
random_select_clients: false

rounds: 100
cpus_per_client: 2

n_steps: 2048
update_epochs: 10
minibatch_size: 64
clip_eps: 0.2
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5

hidden_dim: 256
lr: 3e-4
gamma: 0.99
gae_lambda: 0.95

eval_episodes: 5

use_wandb: false
wandb_project: null
run_name: null

output_dir: "./model/policy/reacher/fedrep"
metrics_dir: "./metrics/reacher/fedrep"
collect_metrics_every: 1

# Device configuration
device: "auto"  # "auto", "cpu", or "cuda"
# Ray Flower VCE: GPU fraction per virtual client (match fedavg; smaller => more parallel actors)
gpus_per_client: 0.25
seed: [0]

render_eval: true
render_mode: "video"
render_save_dir: "./plots/reacher/fedrep"
render_every_n_rounds: 20
render_episodes: 10

bc_root: ./model/bc_policy
bc_env_name: Reacher
