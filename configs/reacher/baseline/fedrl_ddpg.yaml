# FedRL + DDPG — same heterogeneous Reacher clients as other federated baselines

env_type: "reacher_hetero"
metadata_path: "data/reacher/metadata.json"
num_clients: 8
random_select_clients: false

algorithm: "fedrl"
algo: "ddpg"

rounds: 50
cpus_per_client: 2

merge_interval: 1000
gamma: 0.99
tau: 0.001
threshold: 2.0
aggregate_critic: false
batch_size: 64
replay_size: 100000
replay_initial: 1000
eval_episodes: 10
add_noise: true
# Match FedRL DeepRLAlgo.DDPG_TRAIN: fresh replay each local training block; OU exploration
replay_persist_across_rounds: false
ou_enabled: true
ou_mu: 0.0
ou_theta: 0.15
ou_sigma: 0.2
ou_epsilon: 1.0

hidden_dim: 256
lr: 1e-4

use_wandb: false
wandb_project: null
run_name: null

output_dir: "./model/policy/reacher_phase1/fedrl_ddpg"
metrics_dir: "./metrics/reacher_phase1/fedrl_ddpg"
collect_metrics_every: 5

# Device configuration
device: "auto"  # "auto", "cpu", or "cuda"
# Ray Flower VCE: GPU fraction per virtual client (match fedavg; smaller => more parallel actors)
gpus_per_client: 0.25

seed: [0]

render_eval: true
render_mode: "video"
render_save_dir: "./plots/reacher_phase1/fedrl_ddpg"
render_every_n_rounds: 50
render_episodes: 1
