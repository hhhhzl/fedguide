env_type: "reacher_hetero"
metadata_path: "data/reacher/metadata.json"
num_clients: 8
random_select_clients: false

rounds: 100
cpus_per_client: 2

gamma: 0.99

# DDPG (fedrl) replay/critic
batch_size: 20

# Federation regularizers
algorithm: "mfpo"

# BC warm-start (same checkpoint FedGuide uses)
bc_root: "./model/bc_policy"
bc_env_name: "Reacher"
bc_blend_alpha: 0.3

collect_metrics_every: 5

# Logging
use_wandb: false
wandb_project: null
run_name: null

output_dir: "./model/policy/reacher/mfpo"
metrics_dir: "./metrics/reacher/mfpo"

device: "auto"
gpus_per_client: 0.125
seed: [0]

render_eval: true
render_mode: "video"
render_save_dir: "./plots/reacher/mfpo"
render_every_n_rounds: 20
render_all_clients: true                   # render every client, not just client 0
render_episodes: 10

# MFPO
c: 3.0
decay_rate: 0.99
decay_start_iter_id: 500
learning_rate_a: 1e-4
learning_rate_c: 1e-4
lr_a: 1e-4
lr_c: 1e-4
eps: 1e-5
average_type: "target"
local_update: 10
