# FedRL-DDPG Training Configuration for Reacher Environment

# Environment configuration
env_type: "reacher"  # Environment type
data_dir: "data/reacher"
num_clients: 4

# Federated learning configuration
rounds: 100  # Number of federated learning rounds
cpus_per_client: 2  # Number of CPUs per client

# Algorithm type
algo: "ddpg"  # Algorithm: "dqn" or "ddpg"

# DDPG training configuration
merge_interval: 1000  # Number of steps per round (E in FedRL paper)
gamma: 0.99  # Discount factor
tau: 0.001  # Soft update coefficient for target networks
threshold: 2.0  # Action clipping threshold
aggregate_critic: false  # Whether to aggregate critic parameters (default: false, only actor is aggregated)
batch_size: 64  # Batch size for updates
replay_size: 100000  # Replay buffer capacity
replay_initial: 1000  # Minimum buffer size before training
eval_episodes: 1  # Number of episodes for evaluation
add_noise: true  # Whether to add exploration noise during training

# Network configuration
hidden_dim: 256  # Hidden dimension for networks (not directly used in DDPG, kept for consistency)
lr: 1e-4  # Learning rate

# Logging configuration
use_wandb: false  # Enable Weights & Biases logging
wandb_project: null  # W&B project name (null to disable)
run_name: null  # Run name for logging (null to use default)

# Output configuration
output_dir: "./model/policy/reacher/fedrl_ddpg"  # Directory to save model checkpoints
metrics_dir: "./metrics/reacher/fedrl_ddpg"  # Directory to save metrics for visualization
collect_metrics_every: 5  # Collect metrics every N rounds (0 to disable)

# Device configuration
device: "cpu"  # "auto", "cpu", or "cuda"

# Random seed configuration
# Can be a single integer or a list of integers
# If list, will run training for each seed
seed: [0, 1, 2, 3, 4]  # Run 5 different seeds

