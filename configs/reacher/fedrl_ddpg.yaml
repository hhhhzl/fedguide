# FedRL + DDPG — same heterogeneous Reacher clients as other federated baselines

env_type: "reacher_hetero"
metadata_path: "data/reacher/metadata.json"
num_clients: 8
random_select_clients: false

algorithm: "fedrl"
algo: "ddpg"

rounds: 200
cpus_per_client: 2

merge_interval: 1000
gamma: 0.99
tau: 0.001
threshold: 2.0
aggregate_critic: false
batch_size: 64
replay_size: 100000
replay_initial: 1000
eval_episodes: 10
add_noise: true

hidden_dim: 256
lr: 1e-4

use_wandb: false
wandb_project: null
run_name: null

output_dir: "./model/policy/reacher/fedrl_ddpg"
metrics_dir: "./metrics/reacher/fedrl_ddpg"
collect_metrics_every: 5

device: "auto"

seed: [0, 1, 2, 3, 4]
