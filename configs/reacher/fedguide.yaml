# FedGuide — federated Reacher with client heterogeneity (metadata-driven)

env_type: "reacher_hetero"
metadata_path: "data/reacher/metadata.json"
num_clients: 8
random_select_clients: false

rounds: 150
cpus_per_client: 2

n_steps: 2048
lambda_local: 0.05
lambda_guide: 0.1
lambda_guide_anneal: true
lambda_guide_decay_rounds: 150
update_epochs: 10
minibatch_size: 64
init_log_std: 0.0

aggregate_mode: "policy"
use_pretrained_models: false

use_wandb: false
wandb_project: null
run_name: null

output_dir: "./model/policy/reacher/fedguide"
metrics_dir: "./metrics/reacher/fedguide"
collect_metrics_every: 1

client_specific_expert_routing: false
num_experts_prior: 1
num_experts_guidance: 1

device: "auto"

seed: [0, 1, 2, 3, 4]

render_eval: true
render_mode: "video"
render_save_dir: "./plots/reacher/fedguide"
render_every_n_rounds: 10
render_episodes: 5
