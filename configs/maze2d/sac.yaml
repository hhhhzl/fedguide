# SAC Training Configuration for Maze2D D4RL Environment

# Environment configuration
env_type: "d4rl"  # Environment type: "bandit2d" or "d4rl"
env_name: "maze2d-umaze-v1"  # D4RL environment name
num_clients: 1  # Number of clients (for data splitting)

# Training configuration
rounds: 100
update_steps: 1000
batch_size: 256

# Agent configuration
hidden_dim: 256
lr: 3e-4
gamma: 0.99
tau: 0.005
alpha: 0.2  # Temperature parameter
action_std: 0.1  # Action distribution standard deviation

# Evaluation configuration
eval_episodes: 10

# Output configuration
output_dir: "./model/policy/maze2d/sac"
metrics_dir: "./metrics/maze2d/sac"
save_every: 10

# Device configuration
device: "auto"  # "auto", "cpu", or "cuda"

# Random seed configuration
# Can be a single integer or a list of integers
# If list, will run training for each seed
seed: [0, 1, 2, 3, 4]  # Run 5 different seeds

# Rendering configuration (for MuJoCo/Maze environments)
render_eval: true  # Enable rendering during evaluation
render_mode: "video"  # "human" (display), "rgb_array" (collect frames), "video" (save video)
render_save_dir: "./plots/maze2d/sac"  # Directory to save videos
render_every_n_rounds: 10  # Render every N rounds (0 = only last round, -1 = all rounds)
render_episodes: 1  # Number of episodes to render per round

