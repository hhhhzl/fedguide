# FedRL DDPG + BC warm-start. Same as fedrl_ddpg.yaml but actor switches to
# 256→256 Tanh (BC-compatible architecture) and loads per-client BC pretrain
# checkpoint at init. This deviates from upstream DDPG-Avg (which uses 400/300
# ReLU) but matches FedGuide's BC starting policy — necessary for fair same-init
# comparison.

env_type: "d4rl"
env_name: "Hopper-v4"
metadata_path: "data/hopper/metadata_mild64.json"
num_clients: 8
random_select_clients: false

algorithm: "fedrl"
algo: "ddpg"

rounds: 100
cpus_per_client: 2

merge_interval: 4096
gamma: 0.99
tau: 0.001
threshold: 1.0
aggregate_critic: true
batch_size: 64
replay_size: 100000
replay_initial: 1000
eval_episodes: 10
add_noise: true
replay_persist_across_rounds: false
ou_enabled: true
ou_mu: 0.0
ou_theta: 0.15
ou_sigma: 0.2
ou_epsilon: 1.0

hidden_dim: 256
lr: 1e-4

# BC warm-start
bc_root: "./model/bc_policy"
bc_env_name: "Hopper"

use_wandb: false
wandb_project: null
run_name: null

output_dir: "./model/policy/hopper/fedrl_ddpg_bc"
metrics_dir: "./metrics/hopper/fedrl_ddpg_bc"
collect_metrics_every: 5

device: "auto"
gpus_per_client: 0.25
seed: [0]

render_eval: true
render_mode: "video"
render_save_dir: "./plots/hopper/fedrl_ddpg_bc"
render_every_n_rounds: 20
render_episodes: 3
