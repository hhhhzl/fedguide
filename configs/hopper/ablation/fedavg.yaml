env_type: "d4rl"
env_name: "Hopper-v4"
metadata_path: "data/hopper/metadata_hard.json"
num_clients: 8
random_select_clients: false

rounds: 100
cpus_per_client: 2
n_steps: 4096
update_epochs: 10
minibatch_size: 64

hidden_dim: 256
lr: 5e-5
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.1
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5

init_log_std: -0.5
log_std_anneal: true
log_std_anneal_target: -2.0
log_std_anneal_rounds: 60

# Federation regularizers
lambda_global: 0
lambda_local: 0

# BC warm-start (same checkpoint FedGuide uses)
bc_root: "./model/bc_policy"
bc_env_name: "Hopper"
bc_blend_alpha: 0.3

eval_episodes: 10

output_dir: "./model/policy/hopper_hard/fedavg"
metrics_dir: "./metrics/hopper_hard/fedavg"
save_every: 10

device: "auto"
gpus_per_client: 0.125
seed: [0]

render_eval: true
render_mode: "video"
render_save_dir: "./plots/hopper_hard/fedavg"
render_every_n_rounds: 20
render_all_clients: true                   # render every client, not just client 0
render_episodes: 3