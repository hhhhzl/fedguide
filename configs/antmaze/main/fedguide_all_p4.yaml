# Reacher FedGuide ablation D: aggregate everything (Theorem 5).

env_type: "d4rl"
env_name: "antmaze-umaze-v0"
metadata_path: "data/antmaze/metadata.json"
reward_type: "dense"
num_clients: 8
random_select_clients: false

rounds: 50
cpus_per_client: 2

n_steps: 2048
lambda_local: 0.05                # weak trust region — let policy move
lambda_guide: 0.5                 # IS-weighted CE prior loss
lambda_guide_anneal: true         # decay so env reward refines after warm-start
lambda_guide_decay_rounds: 50
update_epochs: 4                  # reduce off-policy bias under multi-epoch reuse
minibatch_size: 64
init_log_std: 0.0

aggregate_mode: "all"
use_pretrained_models: true
prior_adapt_fallback_all: true
prior_dir: "./model/models_prior"
bc_dir: "./model/bc_policy"
bc_env_name: "AntMaze"

moe_enable: true
num_experts_prior: 8
num_experts_guidance: 8
ot_mode: "sinkhorn"
ot_reg: 0.05
personalized_routing: true

policy_activation: "tanh"
action_clamp_low: -1.0
action_clamp_high: 1.0
log_std_anneal: false
log_std_anneal_rounds: 80
log_std_anneal_target: -1.5

guide_coef: 0.0
guidance_eta: 0.1

# Theorem 5: SDICE_Critic keeps learning during federated rounds.
online_guidance: false

use_wandb: false
wandb_project: null
run_name: null

output_dir: "./model/policy/antmaze_phase1/fedguide_all_p4"
metrics_dir: "./metrics/antmaze_phase1/fedguide_all_p4"
collect_metrics_every: 5
gpus_per_client: 0.125

device: "auto"
seed: [0]

render_eval: false
render_mode: "video"
render_save_dir: "./plots/antmaze_phase1/fedguide_all_p4"
render_every_n_rounds: 50
render_episodes: 1

dice_v_blend_alpha: 0.5
policy_agg_every_k: 5
