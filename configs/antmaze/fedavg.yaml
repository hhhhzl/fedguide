# FedAvg on AntMaze (D4RL) — FedKL implementation with lambda_global=0, lambda_local=0
# Mirrors configs/reacher/fedavg.yaml; uses data/antmaze/metadata.json for 8-way heterogeneity.

algorithm: fedkl

# Environment
env_type: "d4rl"
env_name: "antmaze-umaze-v0"
reward_type: "dense"
metadata_path: "data/antmaze/metadata.json"
num_clients: 8
random_select_clients: false

# Federated training
rounds: 100
n_steps: 2048
update_epochs: 10
minibatch_size: 64

# PPO / agent
hidden_dim: 256
lr: 3e-4
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5

# FedAvg = no KL penalties
lambda_global: 0.0
lambda_local: 0.0

eval_episodes: 10

output_dir: "./model/policy/antmaze/fedavg"
metrics_dir: "./metrics/antmaze/fedavg"
save_every: 10

device: "auto"
gpus_per_client: 0.25

seed: 0

render_eval: false
render_mode: "video"
render_save_dir: "./plots/antmaze/fedavg"
render_every_n_rounds: 10
render_episodes: 1
