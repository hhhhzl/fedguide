# Reacher FedGuide ablation C: aggregate prior + guidance (Theorem 4).
# Policies stay local; both prior and guidance heads are OT-MoE aggregated.
# This is where pg should strictly beat prior on a sequential task.

env_type: "d4rl"
env_name: "Ant-v4"
metadata_path: "data/ant/metadata.json"
num_clients: 8
random_select_clients: false

rounds: 50
cpus_per_client: 2

n_steps: 4096
lambda_local: 0.05                # weak trust region — let policy move
lambda_guide: 0.5                 # IS-weighted CE prior loss
lambda_guide_anneal: true         # decay so env reward refines after warm-start
lambda_guide_decay_rounds: 50
update_epochs: 4                  # reduce off-policy bias under multi-epoch reuse
minibatch_size: 64
init_log_std: 0.0

aggregate_mode: "prior+guidance"
use_pretrained_models: true
prior_adapt_fallback_all: true
prior_dir: "./model/models_prior"
bc_dir: "./model/bc_policy"
bc_env_name: "Ant"

moe_enable: true
num_experts_prior: 8
num_experts_guidance: 8
ot_mode: "sinkhorn"
ot_reg: 0.05
personalized_routing: true

policy_activation: "tanh"
action_clamp_low: -1.0
action_clamp_high: 1.0
log_std_anneal: false
log_std_anneal_rounds: 80
log_std_anneal_target: -1.5

guide_coef: 0.1
guidance_eta: 0.1

# Theorem 4: SDICE_Critic keeps learning during federated rounds.
online_guidance: true

use_wandb: false
wandb_project: null
run_name: null

output_dir: "./model/policy/ant_phase1/fedguide_pg"
metrics_dir: "./metrics/ant_phase1/fedguide_pg"
collect_metrics_every: 5
gpus_per_client: 0.125

device: "auto"
seed: [0]

render_eval: true
render_mode: "video"
render_save_dir: "./plots/ant_phase1/fedguide_pg"
render_every_n_rounds: 50
render_episodes: 1
