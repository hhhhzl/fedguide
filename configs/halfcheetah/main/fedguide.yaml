env_type: "d4rl"
env_name: "HalfCheetah-v4"
metadata_path: "data/halfcheetah/metadata.json"
num_clients: 8
random_select_clients: false

rounds: 100
cpus_per_client: 2

n_steps: 4096
lambda_local: 0.05                # weak trust region — let policy move
lambda_guide: 0.5                 # IS-weighted CE prior loss
lambda_guide_anneal: true         # decay so env reward refines after warm-start
lambda_guide_decay_rounds: 50
update_epochs: 4                  # reduce off-policy bias under multi-epoch reuse
minibatch_size: 64
init_log_std: 0.0

aggregate_mode: "prior"
use_pretrained_models: true
prior_adapt_fallback_all: true
prior_dir: "./model/models_prior"          # use real DiffusionGuidance ckpts
# BC warm-start: same per-client policy ckpt that fedavg.yaml loads.
bc_dir: "./model/bc_policy"
bc_env_name: "HalfCheetah"
bc_blend_alpha: 1.0

moe_enable: true
num_experts_prior: 8                       # one expert per client
num_experts_guidance: 8
ot_mode: "sinkhorn"
ot_reg: 0.05
personalized_routing: true

# Reacher action space is [-1, 1]; keep clamp tight to that.
policy_activation: "tanh"
action_clamp_low: -1.0
action_clamp_high: 1.0
log_std_anneal: false                      # keep exploration through training
log_std_anneal_rounds: 80
log_std_anneal_target: -1.5

# Tone guidance MSE down — same lesson as bandit2d Bug-8 fix.
guide_coef: 0.0
guidance_eta: 0.1

use_wandb: false
wandb_project: null
run_name: null

output_dir: "./model/policy/halfcheetah/fedguide"
metrics_dir: "./metrics/halfcheetah/fedguide"
collect_metrics_every: 5
gpus_per_client: 0.125                     # 8 clients on one GPU

device: "auto"
seed: [1]

# Per-client MP4 render every 20 rounds (R20, R40 for a 50-round run).
render_eval: true
render_mode: "video"
render_save_dir: "./plots/halfcheetah/fedguide"
render_every_n_rounds: 20
render_episodes: 3
render_all_clients: true                   # render every client, not just client 0

# Per-client policy checkpoints: snapshots at R20 and R40.
# Default destination: `${metrics_dir}/policies/client_<id>/round_XXXX.pth`.
policy_save_every: 20

# DICE V baseline blend. V_used = α·V_PPO + (1-α)·V_φ. α=0.5 = 50/50.
dice_v_blend_alpha: 0.5
