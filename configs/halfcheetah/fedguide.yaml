# FedGuide — federated HalfCheetah-v4 with metadata-driven dynamics + reward heterogeneity

env_type: "d4rl"
env_name: "HalfCheetah-v4"
metadata_path: "data/halfcheetah/metadata.json"
num_clients: 64
random_select_clients: false

rounds: 150
cpus_per_client: 2

n_steps: 2048
lambda_local: 0.05
lambda_guide: 0.1
lambda_guide_anneal: true
lambda_guide_decay_rounds: 150
update_epochs: 10
minibatch_size: 64
init_log_std: 0.0

aggregate_mode: "policy"
use_pretrained_models: false

use_wandb: false
wandb_project: null
run_name: null

output_dir: "./model/policy/halfcheetah/fedguide"
metrics_dir: "./metrics/halfcheetah/fedguide"
collect_metrics_every: 1

client_specific_expert_routing: false
num_experts_prior: 1
num_experts_guidance: 1

device: "auto"

seed: [0]

render_eval: false
render_mode: "video"
render_save_dir: "./plots/halfcheetah/fedguide"
render_every_n_rounds: 10
render_episodes: 5
