# FedAvg Training Configuration for HalfCheetah with Client Heterogeneity (metadata-driven)

# Environment configuration
env_type: "d4rl"
env_name: "HalfCheetah-v4"
metadata_path: "data/halfcheetah/metadata_mild64.json"
num_clients: 8
random_select_clients: false

# Training configuration
rounds: 50
cpus_per_client: 2
n_steps: 4096
update_epochs: 10
minibatch_size: 64

# Agent configuration (PPO)
hidden_dim: 256
lr: 1e-4
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
entropy_coef: 0.0
value_coef: 0.5
max_grad_norm: 0.5

# FedAvg = FedKL with zero KL penalties (pure policy averaging)
lambda_global: 0
lambda_local: 0

# Evaluation configuration
eval_episodes: 10

# Output configuration
output_dir: "./model/policy/halfcheetah/fedavg"
metrics_dir: "./metrics/halfcheetah/fedavg"
save_every: 10

# Device configuration
device: "auto"
gpus_per_client: 0.25

# Seed configuration
seed: [0]

# Rendering configuration (for MuJoCo environments)
render_eval: true
render_mode: "video"
render_save_dir: "./plots/halfcheetah/fedavg"
render_every_n_rounds: 10
render_episodes: 5
